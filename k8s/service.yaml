# Kubernetes Service: gives the Pods one stable address and load-balances between them.
# NodePort opens the service on a port of the minikube node so a browser can reach it.
apiVersion: v1
kind: Service
metadata:
  name: house-vote-share
spec:
  type: NodePort
  selector:
    app: house-vote-share          # send traffic to Pods with this label (from deployment.yaml)
  ports:
    - port: 80                     # the Service's own port inside the cluster
      targetPort: 8080             # the container's port
      nodePort: 30080              # the port opened on the minikube node (30000-32767)
